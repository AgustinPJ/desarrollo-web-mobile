<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzería Andres Bello — Menú dinámico</title>

<!-- BOOTSTRAP: nos da el grid de 12 columnas y componentes ya hechos (navbar, card, badge) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --rojo-tomate:#C1121F;
    --crema:#FBF3E7;
    --verde-oliva:#52734D;
    --carbon:#2B2118;
  }
  body{
    background:var(--crema);
    color:var(--carbon);
    font-family:'Inter',sans-serif;
  }
  h1, h3, .navbar-brand{
    font-family:'Fraunces',serif;
  }
  .navbar{ background:var(--carbon) !important; }
  .navbar-brand{ color:var(--crema) !important; font-size:1.5rem; }

  .hero{
    padding:3rem 1rem 2rem;
    text-align:center;
  }
  .hero h1{
    font-size:2.5rem;
    color:var(--rojo-tomate);
  }
  .hero p{ color:#6b5d4f; max-width:38rem; margin:0 auto; }

  .pizza-card{
    border:none;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 14px rgba(43, 33, 24, 0.308);
    height:100%;
  }
  .pizza-card .card-body{ padding:1.25rem; }
  .pizza-card .card-title{ color:var(--carbon); }
  .precio{
    color:var(--rojo-tomate);
    font-weight:600;
    font-size:1.2rem;
    margin-bottom:.25rem;
  }
  .badge-destacada{
    background:var(--verde-oliva);
    color:#fff;
  }
  .ingredientes{
    color:#6b5d4f;
    font-size:0.9rem;
    margin-bottom:0;
  }
</style>
</head>
<body onload="mostrarMenu();">

<!-- NAVBAR: componente de Bootstrap -->
<nav class="navbar navbar-dark">
  <div class="container">
    <span class="navbar-brand">🍕 Pizzería Andres Bello</span>
  </div>
</nav>

<header class="hero">
  <h1>Nuestro menú de hoy</h1>
  <p>Las pizzas de abajo no están escritas a mano en el HTML: las genera <code>script.js</code>, y esta página las muestra llamando a <code>mostrarMenu()</code> apenas termina de cargar.</p>
</header>

<main class="container pb-5">
  <div class="row g-4" id="menu-container"></div>
</main>



<script src="script.js"></script>

</body>
</html>
